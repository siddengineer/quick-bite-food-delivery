<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login — QuickBite Pune</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">
<div class="auth-split">
  <div class="auth-brand">
    <div class="auth-brand-inner">
      <div class="brand-logo">🍱</div>
      <h1 class="brand-name">QuickBite</h1>
      <p class="brand-city">Pune</p>
      <p class="brand-tagline">Real restaurants across Pune — delivered to your door.</p>
      <div class="brand-feats">
        <div class="brand-feat"><div class="brand-feat-icon">📍</div>60+ real Pune restaurants</div>
        <div class="brand-feat"><div class="brand-feat-icon">🛵</div>Live rider tracking on map</div>
        <div class="brand-feat"><div class="brand-feat-icon">💳</div>UPI · Card · Cash on delivery</div>
        <div class="brand-feat"><div class="brand-feat-icon">🚀</div>Powered by Spring Boot + H2</div>
      </div>
    </div>
  </div>
  <div class="auth-form-panel">
    <div class="auth-form-box">
      <h2 class="auth-title">Welcome back 👋</h2>
      <p class="auth-sub">Log in to order from the best restaurants in Pune</p>
      <div id="errorMsg" class="auth-error"></div>
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
          <button type="button" class="toggle-pw" onclick="togglePw('password',this)">Show</button>
        </div>
      </div>
      <button class="btn-primary full-width auth-btn" onclick="handleLogin()">Log in</button>
      <div class="auth-divider">or</div>
      <button class="demo-btn" onclick="handleDemoLogin()">⚡ Try demo account (Koregaon Park)</button>
      <p class="auth-switch">New here? <a href="/signup.html">Create account</a></p>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  // If already logged in, go home
  API.get('/api/auth/me').then(r => { if (r.success) window.location.href='/index.html'; });
</script>
</body>
</html>
